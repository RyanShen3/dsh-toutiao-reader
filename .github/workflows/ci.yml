name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check lib/fetch.js
          node --check lib/index.js
      - name: SKILL.md frontmatter
        run: node -e "const fs=require('fs');const t=fs.readFileSync('skills/toutiao-reader/SKILL.md','utf8');if(!t.startsWith('---\n'))process.exit(1);console.log('frontmatter ok')"
      - name: Contract test
        run: node test/contract.test.mjs
